name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          if [ -f "logo.png" ]; then cp logo.png www/logo.png; fi
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          elif [ -f "index.html" ]; then
            cp index.html www/index.html
          else
            cp *.html www/index.html 2>/dev/null || true
          fi

      - name: Install Dependencies
        run: |
          rm -f package.json package-lock.json
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/local-notifications

      - name: Initialize Capacitor
        run: |
          npx cap init "MediaRadar" "com.mediaradar.app" --web-dir www

      - name: Generate Android Project
        run: npx cap add android

      - name: Configure Android Permissions & Network Security
        run: |
          # 1. Create network_security_config.xml
          mkdir -p android/app/src/main/res/xml
          cat <<'EOF' > android/app/src/main/res/xml/network_security_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="user" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

          # 2. Update AndroidManifest.xml with Calendar and Notification Permissions
          python3 - <<'EOF'
          import re

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.READ_CALENDAR" />',
              '<uses-permission android:name="android.permission.WRITE_CALENDAR" />',
              '<uses-permission android:name="android.permission.VIBRATE" />',
              '<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
              '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />',
              '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />'
          ]

          # Insert permissions before <application
          perm_block = "
    " + "
    ".join(permissions) + "
"
          if 'android.permission.INTERNET' not in content:
              content = content.replace("<application", perm_block + "    <application", 1)

          # Ensure networkSecurityConfig & cleartext traffic attributes
          if 'android:networkSecurityConfig' not in content:
              content = re.sub(
                  r'<application(\s+)',
                  r'<application android:usesCleartextTraffic="true" android:networkSecurityConfig="@xml/network_security_config" android:hardwareAccelerated="true"',
                  content,
                  count=1
              )

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(content)

          print("AndroidManifest.xml successfully updated with Calendar and Notification permissions.")
          EOF

      - name: Generate App Icons
        run: |
          npm install @capacitor/assets -D
          mkdir -p resources
          if [ -f "logo.png" ]; then
            cp logo.png resources/icon.png
            npx capacitor-assets generate --android
          elif [ -f "www/logo.png" ]; then
            cp www/logo.png resources/icon.png
            npx capacitor-assets generate --android
          else
            echo "logo.png not found, skipping icon generation."
          fi

      - name: Fix Gradle Build Issues
        run: |
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/g' android/variables.gradle

          cat <<EOF >> android/app/build.gradle

          configurations.all {
              resolutionStrategy {
                  force 'androidx.core:core:1.13.1'
                  force 'androidx.core:core-ktx:1.13.1'
              }
          }

          dependencies {
              constraints {
                  implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22')
                  implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22')
              }
          }
          EOF

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediaradar-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
