name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          if [ -f "logo.png" ]; then cp logo.png www/logo.png; fi
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          else
            cp *.html www/index.html 2>/dev/null || true
          fi

      - name: Install Dependencies
        run: |
          npm install

      - name: Initialize Capacitor
        run: |
          npx cap init "MediaRadar" "com.mediaradar.app" --web-dir www

      - name: Generate Android Project
        run: npx cap add android

      - name: Upgrade Gradle Version for JDK 21
        run: |
          GRADLE_PROP="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$GRADLE_PROP" ]; then
            sed -i 's/gradle-8.0.2-bin.zip/gradle-8.5-bin.zip/g' $GRADLE_PROP
            sed -i 's/gradle-8.[0-9]*-bin.zip/gradle-8.5-bin.zip/g' $GRADLE_PROP
          fi

      - name: Add Permissions to AndroidManifest.xml
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />' $MANIFEST_PATH
          sed -i '/<application/i \    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' $MANIFEST_PATH

      - name: Generate App Icons
        run: |
          mkdir -p resources
          if [ -f "logo.png" ]; then
            cp logo.png resources/icon.png
            npx capacitor-assets generate --android
          elif [ -f "www/logo.png" ]; then
            cp www/logo.png resources/icon.png
            npx capacitor-assets generate --android
          else
            echo "logo.png not found, skipping icon generation."
          fi

      - name: Fix Gradle Build & SDK Versions
        run: |
          VAR_FILE="android/variables.gradle"
          if [ -f "$VAR_FILE" ]; then
            sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/g' $VAR_FILE || true
            sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 34/g' $VAR_FILE || true
            sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 34/g' $VAR_FILE || true
          fi

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediaradar-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
